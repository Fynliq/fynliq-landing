# FYNQ CI. Runs on every PR and on pushes to the protected branches.
# Uses no secrets and no network services: integration suites run on PGlite
# (in-memory Postgres) with fake Stripe and fake OpenAI.
# Actions are pinned to commit SHAs (tag in the trailing comment).
name: CI

on:
  pull_request:
  push:
    branches: [main, feat/connect-ask-backend]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel runs for pushes to protected branches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ops:
    name: Ops config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/validate_ops.py

  app:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'   # matches the Vercel project's Node 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      # test/*.test.mjs are node:test files, so vitest must not collect them.
      - name: Unit and contract tests (vitest)
        run: npx vitest run --exclude 'test/**' --exclude '**/node_modules/**'
      - name: Unit tests (node --test)
        run: node --test test/*.test.mjs
      - name: Integration - beta auth and ask (PGlite, closed-beta schema)
        run: npm run test:beta
      - name: Integration - billing and webhook (PGlite, all migrations, fake Stripe)
        run: npm run test:billing
      - name: Integration - attribution (PGlite, all migrations, fake Stripe)
        run: node test/attribution-integration.mjs
      - name: Integration - intelligence metrics (PGlite, all migrations, read-only RPC)
        run: npm run test:intelligence
