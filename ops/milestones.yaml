# FYNQ milestone controller.
#
# Milestones never deploy, enable or change product features. Reaching one only
# turns on analysis, monitoring and report sections, and asks the human to
# acknowledge it. Nothing here changes max_autonomy_level (ops/autonomy.yaml).
#
# Detection is automatic and read-only: scripts/ops/milestones.py evaluates
# each trigger nightly against the authoritative aggregates from the ops
# metrics view (server/ops-metrics.js -> ops_milestone_metrics()). Reached
# state is kept in the PRIVATE ops repository (state/milestones.json), not
# here, so business numbers never appear in this public repo.
#
# Trigger forms:
#   {metric: <name>, at_least: N}                 metric >= N
#   {metric: <name>, ratio_to: <name>, at_least: N, min: M}
#                                                  metric / other >= N, metric >= M
#   {events_seen: [names], within_days: D}         every listed event recorded in the last D days
#   {seen_within_hours: <name>, hours: H}          the named timestamp metric is within H hours
#   {all: [triggers]} / {any: [triggers]}
#
# Metrics (ops_milestone_metrics): registered_users, unique_successful_uploaders,
# qualified_sessions (reached My Aid), successful_non_test_payments,
# visitors_last_24h, visitors_daily_avg_7d, api_requests_24h,
# rate_limited_share_24h, events_last_seen{event: ts}, api_requests_last_seen.

version: 2
updated: 2026-10-07
evaluation: scheduled_read_only   # detected nightly; activation = report + issue for the human, never a deploy

milestones:

  - id: instrumentation_complete
    trigger:
      all:
        - events_seen: [landing_view, signup_completed, login_completed, my_aid_viewed, upload_started,
                        upload_completed, analysis_completed, results_viewed, checkout_viewed]
          within_days: 7
        - seen_within_hours: api_requests_last_seen
          hours: 24
    metrics_required: [events_last_seen, api_requests_last_seen]
    agents_activated: [qa-agent]
    monitoring_activated: [hourly health check, error-rate alert, webhook failure alert]
    reports_activated: [ceo_morning_report, engineering_report]
    analyses_activated: [funnel_baseline]
    human_approval: Acknowledge that the funnel numbers are trustworthy before any agent proposes changes based on them.

  - id: 25_registered_users
    trigger: {metric: registered_users, at_least: 25}
    metrics_required: [registered_users]
    agents_activated: []
    monitoring_activated: [daily sign-up count]
    reports_activated: [daily funnel analysis]
    analyses_activated: [daily_funnel_analysis]
    human_approval: Confirm the count excludes admin and test accounts.

  - id: 10_unique_uploaders
    trigger: {metric: unique_successful_uploaders, at_least: 10}
    metrics_required: [unique_successful_uploaders]
    agents_activated: [backend-agent]
    monitoring_activated: [reader outcome mix (read / no_aid_lines / unreadable / privacy_blocked / reader_error)]
    reports_activated: [upload conversion analysis]
    analyses_activated: [upload_conversion_analysis]
    human_approval: Approve the upload analysis format, which may only use reason codes, never document content.

  - id: 100_qualified_sessions
    trigger: {metric: qualified_sessions, at_least: 100}
    metrics_required: [qualified_sessions]
    agents_activated: [frontend-agent, performance-agent]
    monitoring_activated: [landing to My Aid conversion by channel and device]
    reports_activated: [CRO experiment recommendations]
    analyses_activated: [cro_experiment_recommendations]
    human_approval: Recommendations only. Every experiment that would change what students see is a normal PR the human approves.

  - id: 10_real_payments
    trigger: {metric: successful_non_test_payments, at_least: 10}
    metrics_required: [successful_non_test_payments]
    agents_activated: [payments-agent]
    monitoring_activated: [daily payment reconciliation, webhook failures]
    reports_activated: [checkout, retention and revenue analysis]
    analyses_activated: [checkout_retention_revenue_analysis]
    human_approval: Approve the reconciliation queries. Any discrepancy goes to the human, never to an automatic fix or refund.

  - id: 250_registered_users
    trigger: {metric: registered_users, at_least: 250}
    metrics_required: [registered_users]
    agents_activated: [performance-agent, security-agent]
    monitoring_activated: [function p95 latency, AI latency and cost per analysis, weekly Supabase advisors]
    reports_activated: [performance and retention monitoring]
    analyses_activated: [performance_retention_monitoring]
    human_approval: Approve the periodic security and performance review schedule.

  - id: 500_registered_users
    trigger: {metric: registered_users, at_least: 500}
    metrics_required: [registered_users]
    agents_activated: [performance-agent]
    monitoring_activated: [capacity headroom (Vercel, Supabase, OpenAI limits)]
    reports_activated: [capacity planning and load-test recommendations]
    analyses_activated: [capacity_planning]
    human_approval: Any load test against non-local infrastructure, and any plan or scaling change, is the human's decision.

  - id: high_traffic_mode
    trigger:
      any:
        - {metric: visitors_last_24h, ratio_to: visitors_daily_avg_7d, at_least: 5, min: 100}
        - {metric: rate_limited_share_24h, at_least: 0.02}
    metrics_required: [visitors_last_24h, visitors_daily_avg_7d, rate_limited_share_24h]
    agents_activated: [performance-agent, release-agent]
    monitoring_activated: [hourly error and latency checks, OpenAI spend guard]
    reports_activated: [incident-style status per ops/runbooks/incident-response.md]
    analyses_activated: [traffic_surge_review]
    human_approval: Firewall, rate-limit, question-budget and scaling changes are human-only. Agents may recommend a merge freeze but not enforce one.
